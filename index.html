<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#151a12">
  <title>Terres Sauvages — Chasse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left"><div id="hud-mode"></div><div id="hud-time"></div></div>
      <div id="compass"><div id="compass-strip"></div><div class="compass-needle"></div></div>
      <div class="hud-right"><div id="hud-money"></div><div id="dog-state"></div></div>
    </div>
    <canvas id="minimap" width="170" height="170"></canvas>
    <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
    <div id="reddot" class="hidden"></div>
    <div id="hitmarker"></div>
    <div id="target-label" class="hidden"></div>
    <div id="prompt" class="hidden"></div>
    <div id="feed"></div>
    <div id="hint" class="hidden"></div>
    <div id="harvest" class="hidden"></div>
    <div class="hud-bl">
      <div class="wind"><div id="wind-arrow">➤</div><span id="wind-speed"></span></div>
      <div id="stance"></div>
      <div id="heart"></div>
      <div id="stamina" class="gauge"><span>Endurance</span><div class="bar"><i></i></div></div>
      <div id="breath" class="gauge"><span>Souffle (H)</span><div class="bar"><i></i></div></div>
      <div id="noise" class="gauge"><span>Bruit</span><div class="bar"><i></i></div></div>
      <div id="vis" class="gauge"><span>Visibilité</span><div class="bar"><i></i></div></div>
    </div>
    <div class="hud-br">
      <div id="busy"></div>
      <div id="ammo-name"></div>
      <div id="ammo-shells"></div>
      <div id="ammo-reserve"></div>
      <div id="ammo-state"></div>
    </div>
  </div>
  <div id="scope" class="hidden"><div class="scope-ring"></div><canvas id="reticle"></canvas></div>
  <div id="binoc" class="hidden"><div class="binoc-mask"></div></div>

  <div id="touch-ui" class="hidden">
    <div id="look-zone"></div>
    <div id="stick"><div id="stick-knob"></div></div>
    <button data-btn="fire" class="tbtn fire">FEU</button>
    <button data-btn="aim" class="tbtn aim">VISER</button>
    <button data-btn="run" class="tbtn run">COURIR</button>
    <button data-btn="reload" class="tbtn reload">R</button>
    <button data-btn="crouch" class="tbtn crouch">▼</button>
    <button data-btn="prone" class="tbtn prone">▬</button>
    <button data-btn="use" class="tbtn use">E</button>
    <button data-btn="call" class="tbtn call">📯</button>
    <button data-btn="dog" class="tbtn dog">🐕</button>
    <button data-btn="binoc" class="tbtn binoc">🔭</button>
    <button data-btn="zoom" class="tbtn zoom">🔍</button>
    <button data-btn="breath" class="tbtn breath">H</button>
    <button data-btn="map" class="tbtn map">🗺</button>
    <button data-btn="switch" class="tbtn switch">⇄</button>
    <button data-btn="pause" class="tbtn pause">II</button>
  </div>

  <div id="menu-root" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
  <div id="pause" class="hidden"></div>
  <div id="loading" class="hidden"><div class="spinner"></div><p>Préparation du territoire…</p></div>
  <noscript>Ce jeu nécessite JavaScript et WebGL.</noscript>

  <script src="lib/three.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/world.js"></script>
  <script src="js/animals.js"></script>
  <script src="js/dogs.js"></script>
  <script src="js/player.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/clays.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
